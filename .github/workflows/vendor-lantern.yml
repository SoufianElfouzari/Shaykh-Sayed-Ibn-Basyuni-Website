name: Vendor optimized CC0 hanging lantern model and preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vendor-lantern.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch verified CC0 GLB and licensed poster
        env:
          GLB_URL: https://files.innerscene.com/library/brass-diya-lantern-5bcf5825/847983add09e9aa080a4/polyhaven-brass-diya-lantern.glb
          POSTER_URL: https://cdn.polyhaven.com/asset_img/primary/brass_diya_lantern.png?height=700&quality=85
        run: |
          set -euo pipefail
          mkdir -p public/models public/assets
          curl --fail --show-error --silent --location --retry 3 \
            --connect-timeout 15 --max-time 180 "$GLB_URL" -o /tmp/brass-diya-lantern-original.glb
          curl --fail --show-error --silent --location --retry 3 \
            --connect-timeout 15 --max-time 120 "$POSTER_URL" -o public/assets/brass-diya-lantern-preview.png

          python3 - <<'PY'
          from pathlib import Path
          import struct

          model = Path("/tmp/brass-diya-lantern-original.glb")
          length = model.stat().st_size
          magic, version, declared = struct.unpack("<4sII", model.read_bytes()[:12])
          assert magic == b"glTF" and version == 2 and declared == length
          assert 100_000 < length < 25_000_000
          poster = Path("public/assets/brass-diya-lantern-preview.png")
          assert poster.read_bytes()[:8] == b"\x89PNG\r\n\x1a\n"
          assert 8_000 < poster.stat().st_size < 3_000_000
          print(f"GLB: {length:,} bytes, poster: {poster.stat().st_size:,} bytes")
          PY

      - name: Optimize web textures and geometry without changing the mesh design
        run: |
          set -euo pipefail
          npx --yes @gltf-transform/cli@4.5.1 optimize \
            /tmp/brass-diya-lantern-original.glb \
            public/models/brass-diya-lantern.glb \
            --texture-size 1024 \
            --texture-compress webp \
            --compress quantize
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path("public/models/brass-diya-lantern.glb")
          raw = p.read_bytes()
          magic, version, declared = struct.unpack("<4sII", raw[:12])
          assert magic == b"glTF" and version == 2 and declared == len(raw)
          assert 25_000 < len(raw) < 7_170_116
          print("Optimized validated GLB:", len(raw), "bytes")
          PY

      - name: Commit optimized model and poster
        run: |
          set -euo pipefail
          git add public/models/brass-diya-lantern.glb public/assets/brass-diya-lantern-preview.png
          if git diff --cached --quiet; then
            echo "Assets already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets: optimize and vendor CC0 lantern model and preview"
          git push origin HEAD:main
