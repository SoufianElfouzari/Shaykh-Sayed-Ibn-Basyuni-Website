name: Website quality checks

on:
  push:
    branches: [main, migration/supabase]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
